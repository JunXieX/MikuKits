name: MikuKits
version: '1.3.0'
main: dev.junxiex.mikukits.MikuKitsPlugin
loader: dev.junxiex.mikukits.MikuKitsLoader
api-version: '26.2'
folia-supported: true
author: JunXieX
description: 基于 Dialog 菜单的高性能礼包插件（Paper/Folia）

# 权限在插件启用时通过 PermissionManager 注册（见 MikuKitsPlugin#registerPermissions），
# 避免 paper-plugin.yml 的 permissions 列表格式（List<Permission>）与文档不一致的风险。

dependencies:
  server:
    Vault:
      load: BEFORE
      required: false
      # Paper 插件类加载隔离：必须加入 Vault 的 classpath 才能引用其 Economy 接口
      join-classpath: true
