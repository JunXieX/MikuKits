name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 需要完整历史与标签注释体，用于提取发版提交正文作为 Release 说明
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: MikuKits
          retention-days: 1
          path: build/libs/*.jar

      - name: Extract release notes from tagged commit
        if: startsWith(github.ref, 'refs/tags/')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Release 说明取自发版标签所指提交的正文（跳过标题行），保持更新日志由作者书写
          git log -1 --pretty=%B "${REF_NAME}" | tail -n +2 > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "未在发版提交正文中找到更新日志，请补写后再发版。" >&2
            exit 1
          fi
          echo "--- Release notes ---"
          cat release_notes.md

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: build/libs/*.jar
          body_path: release_notes.md
